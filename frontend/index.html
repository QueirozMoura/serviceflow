<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f8" />
    <meta name="description" content="ServiceFlow: gestão de ordens de serviço, clientes, equipamentos e financeiro para assistências técnicas." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica o tema salvo antes da primeira pintura (sem preferência salva: tema claro). Mantenha em sincronia com src/utils/theme.ts.
      (function () {
        var theme = 'light';
        try { var saved = window.localStorage.getItem('serviceflow-theme'); if (saved === 'dark' || saved === 'light') theme = saved; } catch (error) { /* armazenamento indisponível */ }
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0e14' : '#f3f4f8');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
    <title>ServiceFlow - Gestão de assistência técnica</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
